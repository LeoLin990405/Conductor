<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; width: 340px; padding: 14px; color: #1f2328; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    p { color: #6b7280; margin: 0 0 10px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 8px; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 6px; background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    #status { margin-top: 10px; font-size: 12px; white-space: pre-wrap; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>订阅到 Conductor</h1>
  <p>在公众号文章页点击，自动把该公众号加入 Conductor 微信公众号订阅。</p>
  <label>Conductor 地址<input id="base" value="http://127.0.0.1:8000"></label>
  <button id="subscribe">一键订阅当前公众号</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
