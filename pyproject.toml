[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conductor-core"
version = "0.1.0"
description = "Conductor — 多 Agent 协作的聚合操作平台"
readme = "README.md"
license = { text = "Apache-2.0" }
# 3.13, not 3.12: the Redis pools block on an asyncio.Condition, and before
# 3.13 a waiter cancelled at its own deadline swallowed a notify instead of
# re-delivering it — so a caller could be told the pool was exhausted while a
# connection sat free. Nothing in this repo can compensate for that.
requires-python = ">=3.13"
dependencies = [
    "httpx[http2]>=0.28.1",
    # LangChain core packages (v1)
    "langchain[mcp]>=1.4.0",
    # >=1.6.11: src/observability/langsmith_tracer.py builds its tracer from
    # tracers.context._get_tracer_kwargs, which replaced _get_tracer_project there.
    "langchain-core>=1.6.11",
    "langchain-openai>=1.6.0",
    # Declared directly because src/llms/vendor/langchain_zai and libs/ptc-cli
    # import it; the 3.x floor is the HTTPX2 client migration.
    "openai>=3.8.0",
    "langchain-anthropic>=1.0.0",
    "langchain_google_genai>=2.0.0",
    "langchain-deepseek>=0.1.4",
    # LangGraph — floor pinned at the beta DeltaChannel on-disk format (messages
    # checkpoints are _DeltaSnapshot/sentinel blobs). langgraph<1.2 cannot read
    # them; downgrading after delta blobs exist strands threads on resume.
    # >=1.2.2 brings upstream id-stamping for DeltaChannel writes (ensure_message_ids
    # in pregel/_messages.py), which stamps id-less BaseMessage/dict/list writes
    # before persistence — the mechanism that keeps reconstruction deterministic
    # paired with the non-minting reducer in ptc_agent.agent.state.
    # >=1.2.16 is the release verified without our old shims: 1.2.13 snapshots a
    # new branch's delta channels (a run or update from an older checkpoint no
    # longer replays the writes it dropped), and 1.2.15 stamps ids on
    # update_state writes.
    "langgraph>=1.2.16,<2",
    # ceiling mirrors langgraph<2 — the postgres saver serializes the same delta
    # blobs and moves in lockstep with core, so it can't cross a major on its own.
    # >=3.2.0: the history walk waits for a target past the first page
    # (langchain-ai/langgraph#8556), and writes replay in the order they ran
    # (writes_sort_key, from the langgraph-checkpoint>=4.3 it requires).
    "langgraph-checkpoint-postgres>=3.2.0,<4",
    # Other dependencies
    "python-dotenv>=1.0.1",
    # Pinned: we import from scrapling.engines._browsers._controllers /
    # ._stealth (private modules) for shielded session teardown. The leading
    # underscore means scrapling can rename/move these without a semver bump,
    # so a range pin would let `uv lock --upgrade` silently break browser
    # fetches. Bump deliberately after verifying the private API still exists.
    "scrapling[fetchers]==0.4.7",
    "html-to-markdown>=3.5.0",
    "trafilatura>=2.0.0",
    "pdfplumber>=0.10.0",
    # >=6.21.4: Dependabot security batch (GHSA-5849-834g-hvw5 et al.) — see docs/security/deps-remaining.md
    "pypdf>=6.21.4",
    "youtube-transcript-api>=1.0.0",
    "playwright",
    "fastapi>=0.113.0",
    # >=4.14.2: Dependabot security batch (GHSA-82r6-8w77-94w6 critical)
    "anyio>=4.14.2",
    "uvicorn>=0.27.1",
    # The preview proxy subclasses the asyncio client to refuse redirects.
    "websockets>=15.0",
    # The public suffix list, for the preview base's separate-site check.
    "tld>=0.13",
    "pandas>=2.2.3",
    "numpy>=1.24,<3.0",
    # >=0.60.1: Dependabot security batch (GHSA-xf7x-x43h-rpqh)
    "json-repair>=0.60.1",
    "jinja2>=3.1.3",
    # Exact pin keeps host and sandbox MCP clients aligned; 2.3.0 includes the 2.2.0 security fixes.
    "mcp==2.3.0",
    # Direct imports in egress/direct_tools.py; keep LangChain MCP integration and app client aligned.
    "fastmcp>=4.1.2",
    "psycopg[binary,pool]>=3.2.9",
    "alembic>=1.15.0",
    "sqlalchemy>=2.0.0",
    "matplotlib",
    "tabulate",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "seaborn",
    "plotly",
    "alibabacloud_oss_v2",
    "aiofiles==24.1.0",
    "setuptools>=84.1.0",
    "rich>=14.2.0",
    "redis>=5.0.0",
    "langchain-qwq>=0.3.0",
    "langsmith-fetch>=0.3.1",
    "structlog",
    # Floor at 0.6.11: that release made the messages delta reducer non-minting
    # (our vendored copy in ptc_agent.agent.state matches it — see the parity test)
    # and switched PatchToolCallsMiddleware off the id-less `Overwrite` write, so
    # langgraph's ensure_message_ids covers every id-less messages write and no
    # app-side id-stamping shim is needed.
    # Ceiling at <0.8: the four symbols we import (PatchToolCallsMiddleware,
    # BackendProtocol, backends.utils) all sit outside deepagents' declared
    # __all__, so a 0.x minor is free to delete them without notice — 0.7.0
    # dropped WriteResult.files_update exactly that way. Bump deliberately.
    "deepagents>=0.6.11,<0.8",
    "daytona>=0.210.0",
    "boto3>=1.42.28",
    "tavily-python>=0.7.18",
    # >=2.14: Dependabot security batch (GHSA-ffc3-869f-jxw9 critical)
    "PyJWT[crypto]>=2.14",
    # >=2026.10.18: Dependabot security batch (GHSA-6q48-6c7w-9gw2 critical)
    "certifi>=2026.10.18",
    "requests>=2.32.5",
    "croniter>=2.0.0",
    # Declared directly because zoneinfo falls back to it: slim OS images ship
    # without the retired zone names browsers still send (Asia/Calcutta).
    "tzdata>=2025.2",
    "aiodocker>=0.23.0",
    "charset-normalizer>=3.4.0",
    # 1.45.1 is the first release past the Dependabot alert on <=1.45.0; the
    # floor keeps a fresh resolve (no uv.lock) from landing below it.
    "opentelemetry-api>=1.45.2",
    "exchange-calendars>=4.13.2",
    "quickjs-rs>=0.2.4,<0.3.0",
    "jsonschema>=4.0",
    # Imported directly (empty Registry = the no-remote-refs discipline), not
    # just as jsonschema's transitive.
    "referencing>=0.30",
    "e2b>=2.53.1,<3",
    # SSH computers. 2.24.1 is the floor because the far end is a machine its
    # owner controls: it bounds packet lengths and stops a server writing
    # outside the paths an SFTP client asked for.
    "asyncssh>=2.24.1,<3",
    # Past threads are searched on the server with the agent's own pattern;
    # RE2 matches in linear time, so no pattern can hold a worker's loop.
    "google-re2>=1.1.20251105",
    "segno>=1.6.1",
    # Local change-impact index. MIT only: py-tree-sitter and the official
    # Python and TypeScript grammars. This does not use GitNexus.
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.scripts]
conductor = "conductor_cli.cli:main"
# N80 collab MCP server (stdio, or HTTP on 127.0.0.1 only). It loads the
# protocol schemas from src/collab, so it runs from a Conductor checkout.
conductor-collab-mcp = "collab_mcp.__main__:main"

[tool.uv.sources]
conductor-cli = { path = "libs/ptc-cli", editable = true }

[project.optional-dependencies]
# The interactive TUI (libs/ptc-cli). An extra, not a runtime dependency: the
# server imports nothing from it, and as a main dependency it inverted the
# package graph. conductor-cli depends on conductor-core, so the root project
# depending back on it formed a cycle every backend install had to build.
cli = ["conductor-cli"]
dev = [
    "ruff",
    # >=26.10.1: Dependabot security batch (GHSA-cg8m-r9f2-5wm2 high)
    "black>=26.10.1",
    "langgraph-cli[inmem]>=0.2.10",
]
test = [
    "pytest>=9.0.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=1.3.0",
    "pytest-socket>=0.7.0",
    # CLI tests import pyte. The root test extra has to carry it so
    # `uv sync --frozen --extra test` at the repo root can run them.
    "pyte>=0.8.2",
    # The xlsx skill test builds fixture workbooks; openpyxl is a sandbox package, not an app one.
    "openpyxl>=3.1.5",
]
# OpenTelemetry SDK + OTLP exporter + auto-instrumentations. Install when
# OTEL_EXPORTER_OTLP_ENDPOINT will be set, otherwise the API ships its own
# no-op tracer/meter and these are unnecessary. Contrib instrumentations
# (0.x.bN) are version-locked to core (1.x.x); bump together.
observability = [
    "opentelemetry-sdk>=1.41.1",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-instrumentation-httpx>=0.62b1",
    "opentelemetry-instrumentation-psycopg>=0.62b1",
    "opentelemetry-instrumentation-redis>=0.62b1",
    "opentelemetry-instrumentation-logging>=0.62b1",
]
# Server-side HTML→PDF export via headless Chromium. Install + run
# `uv run playwright install chromium` to enable the `?format=pdf` routes;
# without it the endpoints return 501 (lazy import, graceful no-op).
pdf = ["playwright>=1.49"]

[tool.hatch.build.targets.wheel]
packages = ["src/ptc_agent", "src/conductor_cli", "src/skills_hub", "src/mcp_hub", "src/instructions_hub", "src/collab_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills/agent-browser" = "conductor_cli/browser/skill"

[tool.uv]
required-version = ">=0.6.15"

# langchain-qwq (through 0.4.0) caps json-repair<0.54.0 but only calls the stable
# json_repair.loads() entrypoint (chat_models.py, already try/except-wrapped), and
# >=0.60.1 patches GHSA-xf7x-x43h-rpqh (high). Override to resolve the conflict.
override-dependencies = ["json-repair>=0.60.1"]

[tool.ruff]
extend-exclude = ["src/llms/vendor", "src/ptc_agent/core/sandbox/livefs_runtime/mfusepy.py"]
# The package supports 3.11; a [tool.ruff] table of its own would make it the
# config root and drop the rules below.

[tool.ruff.lint]
ignore = ["E741"]  # allow short names like l, O, I (common in OHLCV code)
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ptc_agent has ONE module identity: the bare package. A src.-prefixed import
# creates a second copy of every module (separate singletons, unpatched twins).
"src.ptc_agent".msg = "import ptc_agent bare — src.ptc_agent creates a duplicate module identity"

[tool.ruff.lint.per-file-ignores]
# Relative imports inside ptc_agent statically resolve to src.ptc_agent in
# ruff's view but bind to the package's load identity at runtime — exempt.
"src/ptc_agent/**" = ["TID251"]
"src/server/app/setup.py" = ["E402"]  # router imports intentionally placed after app creation
"src/llms/__init__.py" = ["E402"]  # patch must be applied before importing modules that use langchain_anthropic

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
# Bare `pytest` (no args) collects only the root `tests/` tree — the suite CI
# and `make test` already scope to. `libs/ptc-cli` is its own uv project (own
# lockfile/venv and TUI deps the server environment intentionally lacks), so
# its suite can only run there (`cd libs/ptc-cli && uv run pytest tests/`).
# Collecting it from the root also collides with the root `tests` package
# under pytest's prepend import mode (both conftests resolve to the module
# name `tests.conftest`). See docs/PTC-CLI-TEST-COLLECTION.md.
testpaths = ["tests"]
markers = [
    "integration: hits real APIs — requires env vars (deselect with '-m \"not integration\"')",
    "slow: long-running tests (stress, concurrency) -- opt-in",
    "provider_docker: tests requiring Docker daemon",
    "provider_daytona: tests requiring Daytona API key",
    "provider_e2b: tests requiring E2B API key",
    "provider_ssh: tests requiring an SSH machine (see tests/integration/sandbox/ssh_target)",
    "regression: locks live market-data API behavior against a running server + live providers — opt-in",
    "requires_ps: needs a working `ps` (auto-skipped where the sandbox blocks it)",
    "requires_pty: needs a free pty device (auto-skipped where none are available)",
]
addopts = "-m 'not integration and not slow and not regression'"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-socket>=0.7.0",
    "pyte>=0.8.2",
]
